# candle picks its SIMD kernels at compile time; without these the local
# formatter falls back to scalar code and is ~10x slower. AVX2/FMA/F16C
# (x86-64-v3) covers every Intel/AMD desktop CPU since 2013-2015.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+avx,+avx2,+fma,+f16c"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+avx,+avx2,+fma,+f16c"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-feature=+avx,+avx2,+fma,+f16c"]
